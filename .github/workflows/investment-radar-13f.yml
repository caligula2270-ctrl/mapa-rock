name: Investment Radar official SEC 13F refresh
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load latest verified 13F information tables
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python investment-radar/v2/scripts/update_sec_13f.py
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investment-radar/v2/data/latest-13f.json
          git diff --cached --quiet || (git commit -m "Investment Radar: update SEC official filings" && git push)
