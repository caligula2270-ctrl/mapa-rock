name: Investment Radar official SEC company financial facts
on:
  schedule:
    - cron: '19 10 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'investment-radar/v2/scripts/*fundamental*.py'
      - 'investment-radar/v2/scripts/financial_normalizer.py'
      - 'investment-radar/v2/scripts/sector_valuation.py'
      - 'investment-radar/v2/scripts/build_sector_models.py'
      - 'investment-radar/v2/scripts/update_sec_companyfacts.py'
      - '.github/workflows/investment-radar-companyfacts.yml'
permissions:
  contents: write
concurrency:
  group: ir-sec-facts
  cancel-in-progress: false
jobs:
  fetch-company-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and test fundamental audit engine (offline)
        run: |
          python -m compileall -q investment-radar/v2/scripts
          python -m unittest discover -s investment-radar/v2/scripts -p 'test_fundamental_core.py' -v
      - name: Retrieve as-filed XBRL data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python investment-radar/v2/scripts/update_sec_companyfacts.py
      - name: Build audited fundamentals and quality gates
        run: python investment-radar/v2/scripts/analyze_fundamentals.py
      - name: Normalize statements and run sector valuations with hard gates
        run: python investment-radar/v2/scripts/build_sector_models.py
      - name: Commit changed SEC facts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investment-radar/v2/data/sec-financial-facts.json investment-radar/v2/data/fundamental-research.json investment-radar/v2/data/normalized-financials.json investment-radar/v2/data/sector-models.json
          git diff --cached --quiet || (git commit -m "Investment Radar: refresh audited SEC fundamentals" && git push)
